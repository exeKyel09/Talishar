# Production SSL Configuration Notes:
# For production deployments with SSL, ensure your Apache/Nginx reverse proxy has:
# 1. Valid SSL certificate matching all server names (talishar.net, www.talishar.net, api.talishar.net, fe.talishar.net, legacy.talishar.net)
# 2. Use Let's Encrypt or your certificate provider to generate a certificate covering all domains
# 3. Update your reverse proxy (not this container) with the certificate paths
# 4. This Docker container handles HTTP only - SSL termination happens at the reverse proxy
# 
# To fix SSL certificate mismatch warnings (AH01909):
# - Check your Apache/Nginx vhost configuration
# - Verify the certificate includes Subject Alternative Names (SANs) for all domains
# - Command to check cert: openssl x509 -in cert.pem -text -noout | grep -A1 "Subject Alternative Name"

services:
  web-server:
    build:
      dockerfile: Dockerfile
      context: .
      args:
        # The checked-in compose file is the local developer stack. Production
        # builds should use PHP_INI=production and timestamp validation off.
        PHP_INI: development
    restart: always
    volumes:
      - "./:/var/www/html/game"
      - "../Talishar-FE:/opt/project/Talishar-FE" # Frontend project for ad-hoc running of zzCardCodeGenerator.php
      - "./docker/docker-php-ext-xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini" # Xdebug configuration
      - "./docker/docker-php-ext-opcache.ini:/usr/local/etc/php/conf.d/docker-php-ext-opcache.ini" # OPCache configuration
      - "./docker/docker-php-apcu-tuning.ini:/usr/local/etc/php/conf.d/zz-talishar-apcu-tuning.ini" # APCu cache size (gamestate cache)
      - "./docker/apache-performance.conf:/etc/apache2/conf-enabled/zz-talishar-performance.conf" # gzip for JSON + SSE worker headroom
#      - "./.tmp:/tmp" # Temporary files for debugging
    command: apache2-foreground
    ports:
      - "8080:80"
      - "5173:5173" # Frontend dev server (frontend service shares this network)
    depends_on:
      - redis
      - mysql-server
    environment:
      PHP_FPM_CLEAR_ENV: "no"
      MYSQL_ROOT_PASSWORD: "secret"
      MYSQL_SERVER_NAME: "mysql-server"
      MYSQL_SERVER_USER_NAME: "root"
      REDIS_HOST: "app_redis"
      REDIS_ENABLED: "true"
      PERFORMANCE_METRICS_ENABLED: "false"
      PERFORMANCE_METRICS_SAMPLE_RATE: "0.1"
      # Faster local runtime; restart web-server after PHP edits to load them.
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
      DOMAIN: "localhost"
      METAFY_CLIENT_ID: "4gIw_YYtamUjZ0yadyy3gYaL_BJkaRnPOa5SKCLbEPI"
      METAFY_LOGIN_CLIENT_ID: "2gAjeLUQxKdjOUaMP63CyoVHqedqkjQLa-WntE6UHss"
  frontend:
    image: node:24.16.0-bookworm # Matches Talishar-FE/.nvmrc
    restart: always
    working_dir: /app
    volumes:
      - "../Talishar-FE:/app"
      - "frontend-node-modules:/app/node_modules" # Linux node_modules, kept apart from the host's Windows/macOS ones
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    # Shares web-server's network so the Vite proxy calls the backend as "localhost",
    # which the backend relies on (SERVER_NAME === 'localhost') to detect local dev.
    # Port 5173 is therefore published on web-server.
    network_mode: "service:web-server"
    depends_on:
      - web-server
    environment:
      VITE_BACKEND_URL: "localhost"
      VITE_BACKEND_PORT: "80"
      VITE_BACKEND_DIRECTORY: "game"
      CHOKIDAR_USEPOLLING: "true" # Hot reload through bind mounts on Windows/macOS
  mysql-server:
    image: mysql:lts
    restart: always
    command: --max_connections=500
    environment:
      PHP_FPM_CLEAR_ENV: "no"
      MYSQL_ROOT_PASSWORD: "secret"
      MYSQL_SERVER_NAME: "mysql-server"
      MYSQL_SERVER_USER_NAME: "root"
      MYSQL_DATABASE: "fabonline"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./Database:/docker-entrypoint-initdb.d
  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    environment:
      PMA_HOST: mysql-server
      PMA_USER: root
      PMA_PASSWORD: "secret"
    ports:
      - "5001:80"
  redis:
    image: redis:7.0
    container_name: app_redis
    ports:
      - "6382:6379"
volumes:
  mysql-data:
  frontend-node-modules:
